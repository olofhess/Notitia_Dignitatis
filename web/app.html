<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Living Notitia</title>

<link rel="stylesheet" href="notitia.css">

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css">

</head>

<body>

<header id="header">

    <div id="title">

        <h1>Living Notitia</h1>

        <div id="subtitle">
            Interactive edition of the Notitia Dignitatum
        </div>

    </div>

    <div id="toolbar">

        <input
            id="searchBox"
            type="search"
            placeholder="Search...">

    </div>

</header>

<main id="workspace">

    <nav id="treePanel">

        <h2>Document</h2>

        <div id="tree"></div>

    </nav>

    <section id="contentPanel">

    <div id="content"></div>

    <div id="map"></div>

</section>

    <aside id="inspectorPanel">

        <h2>Inspector</h2>

        <div id="inspector"></div>

    </aside>

</main>

<footer id="statusBar">

    <span id="status">
        Ready
    </span>

</footer>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>

<script type="module" src="js/app.js"></script>

</body>

</html>
