<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Living Notitia</title>

<style>

html,
body {
    margin: 0;
    min-height: 100%;
    background: #efe6d2;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow-x: hidden;
}

.homepage {
    position: relative;
    width: min(
        100vw,
        calc(100vh * 1.7768331562)
    );
    aspect-ratio: 1672 / 941;
}

.homepage img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.enter-app {
    position: absolute;
    left: 25.36%;
    top: 53.24%;
    width: 11.84%;
    height: 5.63%;
    z-index: 2;
    border-radius: 0.5rem;
}

.about-project {
    position: absolute;
    left: 25.15%;
    top: 60.80%;
    width: 12.85%;
    height: 5.25%;
    z-index: 2;
    border-radius: 0.5rem;
}

/* Demo: manuscript image -> exact Notitia line.
   Position is intentionally isolated here so it is easy to fine-tune. */
.amida-demo {
    position: absolute;
    left: 65.0%;
    top: 15.0%;
    width: 10.5%;
    height: 9.0%;
    z-index: 3;
    border-radius: 0.35rem;
    cursor: pointer;
}

.amida-demo:hover {
    outline: 2px solid rgba(255, 245, 210, 0.9);
    background: rgba(255, 245, 210, 0.10);
}

.enter-app:focus-visible,
.about-project:focus-visible,
.amida-demo:focus-visible {
    outline: 3px solid #ffffff;
    outline-offset: 3px;
}

@media (
    max-aspect-ratio: 1672 / 941
) {

    .homepage {
        width: 100vw;
        height: auto;
    }

}

</style>

</head>

<body>

<main class="homepage">

    <img
        src="living-notitia-home.webp"
        alt="Living Notitia — explore the Notitia Dignitatum through text, structure, context, and map.">

    <a
        class="amida-demo"
        href="app.html?document=Oriens&line=1066"
        aria-label="Open Amida in Living Notitia"
        title="Amida — open the corresponding Notitia entry">
    </a>

    <a
        class="enter-app"
        href="app.html"
        aria-label="Enter the Living Notitia app"
        title="Enter the App">
    </a>

   <a
    class="about-project"
    href="About-the-Project.rtf"
    target="_blank"
    rel="noopener"
    aria-label="About the Living Notitia project"
    title="About the Project">
</a>

</main>

</body>

</html>
